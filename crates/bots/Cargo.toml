[package]
name = "yappr-bot"
version.workspace = true
edition.workspace = true

[[bin]]
name = "twitch-bot"
path = "src/twitch_bot.rs"
required-features = ["twitch"]

[dependencies]
chrono.workspace = true
eyre.workspace = true
futures.workspace = true
moka = { workspace = true, features = ["future"] }
regex.workspace = true
reqwest.workspace = true
sea-orm.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
tokio-tungstenite = { workspace = true, features = [
  "rustls-tls-webpki-roots",
  "native-tls",
  "url",
] }

tracing.workspace = true
tracing-subscriber.workspace = true
twitch_api = { workspace = true, optional = true }
twitch_oauth2 = { workspace = true, optional = true }
url.workspace = true
yappr-shared = { path = "../shared", features = ["database"] }

[features]
default = ["twitch"]
twitch = ["twitch_api", "twitch_oauth2"]
