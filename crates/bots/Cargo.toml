[package]
name = "yappr-bot"
version.workspace = true
edition.workspace = true

[[bin]]
name = "twitch-bot"
path = "src/twitch_bot.rs"
required-features = ["twitch"]

[[bin]]
name = "discord-bot"
path = "src/discord_bot.rs"
required-features = ["discord"]

[dependencies]
chrono.workspace = true
eyre.workspace = true
futures.workspace = true
moka = { workspace = true, features = ["future"] }
regex.workspace = true
reqwest.workspace = true
sea-orm.workspace = true
serde_json.workspace = true
hex_color.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
tokio-tungstenite = { workspace = true, features = [
  "rustls-tls-webpki-roots",
  "native-tls",
  "url",
] }

tracing.workspace = true
twitch_api = { workspace = true, optional = true }
twitch_oauth2 = { workspace = true, optional = true }
serenity = { workspace = true, optional = true, features = ["client", "gateway", "model", "cache", "rustls_backend"] }
url.workspace = true
yappr-shared = { path = "../shared", features = ["database", "loki", ] }

[features]
default = ["twitch", "discord"]
twitch = ["twitch_api", "twitch_oauth2", "yappr-shared/twitch", "yappr-shared/loki", "yappr-shared/youtube"]
discord = ["serenity", "yappr-shared/discord", "yappr-shared/loki"]
