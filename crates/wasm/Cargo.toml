[package]
name = "yappr-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
charming = { version = "0.6.0", features = ["wasm"] }
chrono = { version = "0.4", features = ["serde", "wasm-bindgen"] }
gloo = "0.11.0"
gloo-net = "0.6.0"
js-sys = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4.55"
yew = { version = "0.21", features = ["csr"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[dependencies.web-sys]
features = [
  "console",
  "Document",
  "Element",
  "Node",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlCanvasElement",
  "HtmlSelectElement",
  "HtmlButtonElement",
  "HtmlAnchorElement",
  "HtmlFormElement",
  "HtmlOptionElement",
  "HtmlOptionsCollection",
  "FormData",
  "File",
  "DomTokenList",
  "CanvasRenderingContext2d",
  "NodeList",
  "Window",
  "Storage",
  "CssStyleDeclaration",
  "HtmlCollection",
  "MouseEvent",
  "EventTarget",
  "Event",
  "InputEvent",
  "PointerEvent",
  "DomRect",
  "Location",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "FileList",
  "CustomEvent",
  "Request",
  "RequestInit",
  "Headers",
  "Response",
]
version = "0.3"

[profile.release]
lto = true
opt-level = "s"
