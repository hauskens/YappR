[package]
name = "yappr-shared"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1"
chrono = { workspace = true }
chrono-tz.workspace = true
dotenv.workspace = true
eyre = { workspace = true, optional = true }
google-youtube3 = { version = "*", optional = true }
hex_color = "3.0.0"
regex.workspace = true
reqwest = { workspace = true, optional = true, default-features = false }
sea-orm = { workspace = true, optional = true }
semver.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
twitch_api = { workspace = true, optional = true }
twitch_oauth2 = { workspace = true, optional = true }
url.workspace = true
strum_macros.workspace = true
strum.workspace = true
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "streams"], optional = true }
rmp-serde = { version = "1.3", optional = true }
uuid = { version = "1.18", features = ["v4"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
async-nats = { version = "0.44", optional = true }
futures = { version = "0.3", optional = true }

[features]
default = ["database", "twitch", "youtube", "http", "discord", "redis-client", "job-queue"]
database = ["dep:sea-orm"]
discord = []
twitch = ["dep:twitch_oauth2", "dep:twitch_api"]
youtube = ["dep:google-youtube3"]
http = ["dep:reqwest", "dep:eyre"]
http-wasm = ["dep:reqwest", "reqwest/json", "dep:eyre"]
http-server = ["dep:reqwest", "reqwest/json", "reqwest/rustls-tls", "dep:eyre"]
redis-client = ["dep:redis", "dep:rmp-serde", "dep:uuid", "dep:tokio"]
job-queue = ["dep:async-nats", "dep:futures", "dep:tokio"]
