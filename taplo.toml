# Sorts `Cargo.toml` dependencies. All other `.toml` files are formatted with the default config.
#
# https://taplo.tamasfe.dev/configuration/file.html#configuration-file


include = [
  "*.toml",
  "src/**/*.toml",
  ".cargo/**/*.toml",
  "web/**/*.toml",
  "cli/**/*.toml",
  "shared/**/*.toml",
  "app/**/*.toml",
  "wasm/**/*.toml",
]

[formatting]
reorder_keys = false

[[rule]]
include = ["**/Cargo.toml"]
keys = ["dependencies"]

[rule.formatting]
reorder_keys = true
