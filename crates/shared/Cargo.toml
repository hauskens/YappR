[package]
name = "yappr-shared"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-nats = { workspace = true, optional = true }
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
dotenv.workspace = true
futures = { workspace = true, optional = true }
google-youtube3 = { version = "*", optional = true }
hex_color.workspace = true
regex.workspace = true
reqwest = { workspace = true, optional = true, default-features = false }
rmp-serde = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
semver.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
strum.workspace = true
strum_macros.workspace = true
tokio = { workspace = true, features = ["full"], optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-loki = { workspace = true, optional = true }
twitch_api = { workspace = true, optional = true }
twitch_oauth2 = { workspace = true, optional = true }
url.workspace = true
uuid = { workspace = true, features = ["v4"], optional = true }

[features]
default = [
  "database",
  "twitch",
  "youtube",
  "discord",
  "job-queue",
]
database = ["dep:sea-orm"]
discord = []
twitch = ["dep:twitch_oauth2", "dep:twitch_api", "dep:reqwest"]
youtube = ["dep:google-youtube3"]
job-queue = ["dep:async-nats", "dep:futures", "dep:tokio", "dep:rmp-serde"]
loki = ["dep:tracing-loki"]
