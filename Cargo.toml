[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.metadata.crane]
name = "yappr-workspace"

[workspace.dependencies]
axum = "0.8.6"
chrono = "0.4.42"
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
futures = "0.3"
regex = "1.12.2"
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1" }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-loki = "0.2"
twitch_api = { version = "0.7", features = [
  "client",
  "eventsub",
  "helix",
  "reqwest",
] }
twitch_oauth2 = "0.15"
url = "2.5"
sea-orm = { version = "1.1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
dotenv = "0.15"
semver = "1.0"
strum_macros = "0.27"
strum = "0.27"
wasm-bindgen = "=0.2.100"
web-sys = "0.3"
js-sys = "0.3"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4", "js"] }
async-trait = "0.1"
hex_color = "3"
redis = "0.32"
rmp-serde = "1.3"
axum-login = "0.18"
base64 = "0.22"
console_error_panic_hook = "0.1"
leptos = "0.8"
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
leptos-chartistry = "0.2"
openidconnect = "3"
rand = "0.8"
time = "0.3"
tower-http = "0.6"
tower-sessions = "0.14"
tower-sessions-sqlx-store = "0.15"
tokio-tungstenite = "0.28"
moka = "0.12"


# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

