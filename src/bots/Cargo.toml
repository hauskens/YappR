[package]
name = "yappr-bot"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bot"
path = "src/twitch_bot.rs"

[dependencies]
yappr-shared = { path = "../shared" }
twitch_api = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
twitch_oauth2 = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "native-tls", "url"] }
url = { workspace = true }
futures.workspace = true

[features]
default = ["http"]
http = []

