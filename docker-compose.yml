services:
  db:
    image: pgvector/pgvector:pg17
    restart: always
    hostname: postgres-db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 60s
      start_interval: 1s
      timeout: 10s
      retries: 5
      start_period: 80s
    networks:
      - internal
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
    volumes:
      # - db:/var/lib/postgresql/data
      - ./test_db/data3:/var/lib/postgresql/data
      - ./test_db/restore:/restore
  cache:
    image: redis:7-alpine
    restart: always
    hostname: redis-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 60s
      start_interval: 1s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - internal
  nats:
    image: nats
    ports:
      - "8222:8222"
      - "4222:4222"
    networks:
      - internal
    command: "--http_port 8222 --jetstream"

  web:
    image: ${REGISTRY-}yappr-web:${VERSION-}
    build:
      context: .
      dockerfile: src/web/Dockerfile
      # target: development
    ports:
      - "3000:3000"
      - "3001:3001"
    networks:
      - internal
    env_file:
      - path: .env
        required: false
    volumes:
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/app/target
      - node-modules:/app/node_modules
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src/web/src/
          target: /app/src/web/src/
        - action: sync
          path: ./src/web/public/
          target: /app/src/web/public/
        - action: sync
          path: ./src/shared/
          target: /app/src/shared/
        - action: rebuild
          path: ./src/web/Cargo.toml
        - action: rebuild
          path: ./src/web/package.json
        - action: sync
          path: ./src/web/style/
          target: /app/src/web/style/
    
volumes:
  cargo-cache:
  cargo-git:
  cargo-target:
  node-modules:
networks:
  internal:
    driver: bridge
