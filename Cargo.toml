[workspace]
members = ["src/shared", "src/web", "src/bots", "src/cli", "src/wasm"]
resolver = "3"

[workspace.dependencies]
axum = "0.8.6"
chrono = "0.4.42"
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
futures = "0.3"
regex = "1.12.2"
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-loki = "0.2"
twitch_api = { version = "0.7", features = [
  "client",
  "eventsub",
  "helix",
  "reqwest",
] }
twitch_oauth2 = "0.15"
url = "2.5"
sea-orm = { version = "1.1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
dotenv = "0.15"
semver = "1.0"
strum_macros = "0.27"
strum = "0.27"

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"


